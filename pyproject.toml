[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "coach-claude"
version = "0.5.0"
description = "AI running coach powered by Garmin and Strava data"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "garminconnect>=0.2.22",
    "aiosqlite>=0.20.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "chromadb>=0.5.23",
    "langchain-google-genai>=2.0.0",
    "langchain-core>=0.3.0",
    "langgraph>=0.2.0",
    "bcrypt>=4.0.1",
    "python-jose[cryptography]>=3.3.0",
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27.0",
]

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["backend"]
