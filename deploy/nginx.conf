server {
    listen 80;
    server_name __DOMAIN__;

    # All traffic requires a password (protects from random internet users)
    auth_basic "Coach Claude";
    auth_basic_user_file /etc/nginx/.htpasswd;

    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Required for chat streaming (SSE)
        proxy_buffering    off;
        proxy_cache        off;

        # Long timeouts: Garmin sync can take several minutes
        proxy_read_timeout  600s;
        proxy_send_timeout  600s;
        proxy_connect_timeout 10s;
    }
}
# certbot will append an HTTPS server block here automatically
